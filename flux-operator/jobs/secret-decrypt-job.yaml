# Decrypts git-secret.enc.yaml into the flux-system/git Secret. Manual
# prerequisite: the flux-system/sops-age Secret (see git-secret.enc.yaml).
# `apk add sops age` is unpinned at runtime — accepted risk, see README.
apiVersion: batch/v1
kind: Job
metadata:
  name: sops-decrypt-git-secret
spec:
  activeDeadlineSeconds: 900
  backoffLimit: 3
  ttlSecondsAfterFinished: 1800
  template:
    spec:
      serviceAccountName: sops-decrypt
      restartPolicy: Never
      containers:
        - name: decrypt
          image: alpine/k8s:1.32.13
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              apk add --no-cache sops age >/dev/null
              SOPS_AGE_KEY_FILE=/age/age.agekey \
                sops -d /encrypted/git-secret.enc.yaml | kubectl apply -f -
          volumeMounts:
            - name: git-secret-encrypted
              mountPath: /encrypted
            - name: sops-age
              mountPath: /age
              readOnly: true
      volumes:
        - name: git-secret-encrypted
          configMap:
            name: git-secret-encrypted
        - name: sops-age
          secret:
            secretName: sops-age
