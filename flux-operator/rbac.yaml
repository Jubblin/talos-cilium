apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluxinstance-apply
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sops-decrypt
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: fluxinstance-apply
rules:
  - apiGroups: ["fluxcd.controlplane.io"]
    resources: ["fluxinstances"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sops-decrypt
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluxinstance-apply-crd-check
rules:
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: fluxinstance-apply
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: fluxinstance-apply
subjects:
  - kind: ServiceAccount
    name: fluxinstance-apply
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sops-decrypt
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: sops-decrypt
subjects:
  - kind: ServiceAccount
    name: sops-decrypt
    namespace: flux-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluxinstance-apply-crd-check
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: fluxinstance-apply-crd-check
subjects:
  - kind: ServiceAccount
    name: fluxinstance-apply
    namespace: flux-system
