cluster:
  allowSchedulingOnControlPlanes: true
  network:
    cni:
      name: custom
  proxy:
    disabled: true
  inlineManifests:
    - name: cilium-bootstrap
      contents: |-
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: cilium-installer
          namespace: kube-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: cilium-installer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: cilium-installer
          namespace: kube-system
        ---
        apiVersion: v1
        data:
          values.yaml: |
            # helm install cilium cilium/cilium --version 1.20.5 --namespace kube-system -f cilium/values.yaml
            #
            # Talos requirements for a CNI running as the sole network provider with
            # kube-proxy replaced (cluster.proxy.disabled must be
            # set in the Talos config before this chart is installed):
            #   - k8sServiceHost/k8sServicePort point at KubePrism (127.0.0.1:7445),
            #     which every Talos node exposes locally so Cilium can reach the API
            #     server without an external load balancer.
            #   - cgroup.autoMount is disabled because Talos already mounts the unified
            #     cgroupv2 hierarchy at /sys/fs/cgroup.
            #   - Talos does not allow workloads to load kernel modules, so SYS_MODULE
            #     is dropped from Cilium's default capability set.
            ipam:
              mode: kubernetes

            kubeProxyReplacement: true

            k8sServiceHost: localhost
            k8sServicePort: 7445

            cgroup:
              autoMount:
                enabled: false
              hostRoot: /sys/fs/cgroup

            securityContext:
              capabilities:
                ciliumAgent:
                  - CHOWN
                  - KILL
                  - NET_ADMIN
                  - NET_RAW
                  - IPC_LOCK
                  - SYS_ADMIN
                  - SYS_RESOURCE
                  - DAC_OVERRIDE
                  - FOWNER
                  - SETGID
                  - SETUID
                cleanCiliumState:
                  - NET_ADMIN
                  - SYS_ADMIN
                  - SYS_RESOURCE
        kind: ConfigMap
        metadata:
          name: cilium-values-8tb46bk6d6
          namespace: kube-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: cilium-install
          namespace: kube-system
        spec:
          activeDeadlineSeconds: 2400
          backoffLimit: 3
          template:
            spec:
              containers:
              - args:
                - |
                  set -eu
                  helm repo add cilium https://helm.cilium.io/
                  helm repo update
                  helm upgrade --install cilium cilium/cilium \
                    --version 1.20.5 \
                    --namespace kube-system \
                    -f /values/values.yaml \
                    --wait --timeout 10m
                command:
                - /bin/sh
                - -c
                env:
                - name: KUBECONFIG
                  value: /etc/kubeconfig/kubeconfig
                image: alpine/k8s:1.36.6
                name: cilium-install
                volumeMounts:
                - mountPath: /values
                  name: values
                  readOnly: true
                - mountPath: /etc/kubeconfig
                  name: kubeconfig-in-cluster
                  readOnly: true
              dnsPolicy: Default
              hostNetwork: true
              initContainers:
              - args:
                - |
                  set -eu

                  # Wait (max 15 min) for the API, at least one control-plane node,
                  # and a control-plane count unchanged for 60 s, so a staggered
                  # join settles before Helm runs. The count is not validated
                  # against an expected size; check node count in Omni.
                  deadline=$(( $(date +%s) + 900 ))
                  last=-1
                  stable_since=$(date +%s)
                  while :; do
                    now=$(date +%s)
                    if [ "$now" -ge "$deadline" ]; then
                      echo "Timed out waiting for a stable control-plane node count (last seen: $last)" >&2
                      exit 1
                    fi
                    if kubectl get --raw=/healthz >/dev/null 2>&1; then
                      cp_count=$(kubectl get nodes -l node-role.kubernetes.io/control-plane -o name 2>/dev/null | wc -l)
                      if [ "$cp_count" -ne "$last" ]; then
                        last=$cp_count
                        stable_since=$now
                      fi
                      echo "API healthy; control-plane nodes: $cp_count (unchanged for $((now - stable_since))s)"
                      if [ "$cp_count" -ge 1 ] && [ $((now - stable_since)) -ge 60 ]; then
                        break
                      fi
                    else
                      echo "API server not reachable yet..."
                      last=-1
                    fi
                    sleep 10
                  done
                  echo "Proceeding with $last control-plane node(s)."

                  echo "Checking kube-proxy is disabled..."
                  if kubectl -n kube-system get daemonset kube-proxy >/dev/null 2>&1; then
                    echo "kube-proxy DaemonSet is still present — cluster.proxy.disabled was not applied to this cluster" >&2
                    exit 1
                  fi

                  echo "Checking for a stuck previous cilium release..."
                  if helm status cilium -n kube-system >/tmp/cilium-status.txt 2>/dev/null; then
                    existing_status=$(awk '/^STATUS:/ {print $2}' /tmp/cilium-status.txt)
                    if [ "$existing_status" != "deployed" ]; then
                      echo "Existing cilium release is in state '$existing_status', not 'deployed' — resolve manually (e.g. helm uninstall cilium -n kube-system) before retrying" >&2
                      exit 1
                    fi
                  fi

                  echo "Preflight checks passed."
                command:
                - /bin/sh
                - -c
                env:
                - name: KUBECONFIG
                  value: /etc/kubeconfig/kubeconfig
                image: alpine/k8s:1.36.6
                name: preflight
                volumeMounts:
                - mountPath: /etc/kubeconfig
                  name: kubeconfig-in-cluster
                  readOnly: true
              nodeSelector:
                node-role.kubernetes.io/control-plane: ""
              restartPolicy: Never
              serviceAccountName: cilium-installer
              tolerations:
              - effect: NoSchedule
                key: node.kubernetes.io/not-ready
                operator: Exists
              - effect: NoExecute
                key: node.kubernetes.io/not-ready
                operator: Exists
              - effect: NoExecute
                key: node.kubernetes.io/unreachable
                operator: Exists
              - effect: NoSchedule
                key: node-role.kubernetes.io/control-plane
                operator: Exists
              volumes:
              - configMap:
                  name: cilium-values-8tb46bk6d6
                name: values
              - configMap:
                  name: kubeconfig-in-cluster
                name: kubeconfig-in-cluster
          ttlSecondsAfterFinished: 1800
    - name: flux-operator-bootstrap
      contents: |-
        apiVersion: v1
        kind: Namespace
        metadata:
          name: flux-system
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: flux-operator-installer
          namespace: flux-system
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: fluxinstance-apply
          namespace: flux-system
        ---
        apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: sops-decrypt
          namespace: flux-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: fluxinstance-apply
          namespace: flux-system
        rules:
        - apiGroups:
          - fluxcd.controlplane.io
          resources:
          - fluxinstances
          verbs:
          - get
          - create
          - update
          - patch
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: Role
        metadata:
          name: sops-decrypt
          namespace: flux-system
        rules:
        - apiGroups:
          - ""
          resources:
          - secrets
          verbs:
          - get
          - create
          - update
          - patch
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRole
        metadata:
          name: fluxinstance-apply-crd-check
        rules:
        - apiGroups:
          - apiextensions.k8s.io
          resources:
          - customresourcedefinitions
          verbs:
          - get
          - list
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: fluxinstance-apply
          namespace: flux-system
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: fluxinstance-apply
        subjects:
        - kind: ServiceAccount
          name: fluxinstance-apply
          namespace: flux-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: RoleBinding
        metadata:
          name: sops-decrypt
          namespace: flux-system
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: Role
          name: sops-decrypt
        subjects:
        - kind: ServiceAccount
          name: sops-decrypt
          namespace: flux-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: flux-operator-installer
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: cluster-admin
        subjects:
        - kind: ServiceAccount
          name: flux-operator-installer
          namespace: flux-system
        ---
        apiVersion: rbac.authorization.k8s.io/v1
        kind: ClusterRoleBinding
        metadata:
          name: fluxinstance-apply-crd-check
        roleRef:
          apiGroup: rbac.authorization.k8s.io
          kind: ClusterRole
          name: fluxinstance-apply-crd-check
        subjects:
        - kind: ServiceAccount
          name: fluxinstance-apply
          namespace: flux-system
        ---
        apiVersion: v1
        data:
          values.yaml: ""
        kind: ConfigMap
        metadata:
          name: flux-operator-values-bd478ft2hd
          namespace: flux-system
        ---
        apiVersion: v1
        data:
          instance.yaml: |
            # Applied automatically by jobs/instance-apply-job.yaml, which polls for the
            # FluxInstance CRD (installed by jobs/job.yaml's Helm chart) before applying
            # this. Manual re-trigger: kubectl apply -f flux-operator/instance.yaml (once
            # the CRD and the flux-system/git secret both exist).
            apiVersion: fluxcd.controlplane.io/v1
            kind: FluxInstance
            metadata:
              name: flux
              namespace: flux-system
            spec:
              distribution:
                version: "2.x"
                registry: "ghcr.io/fluxcd"
              components:
                - source-controller
                - kustomize-controller
                - helm-controller
                - notification-controller
              cluster:
                type: kubernetes
                multitenant: false
                networkPolicy: true
              sync:
                kind: GitRepository
                url: "https://github.com/Jubblin/stormcraft.git"
                ref: "refs/heads/main"
                path: "clusters/stormcraft"
                pullSecret: "git"
        kind: ConfigMap
        metadata:
          name: fluxinstance-manifest-mg4h862fh9
          namespace: flux-system
        ---
        apiVersion: v1
        data:
          git-secret.enc.yaml: |
            # PLACEHOLDER — not real ciphertext. The decrypt Job fails until the owner
            # replaces this file with the output of `sops -e` (age recipient only; the
            # private key and PAT are never committed):
            #   age-keygen -o age.agekey                      # keep age.agekey out of git
            #   kubectl -n flux-system create secret generic sops-age --from-file=age.agekey
            #   # put the secret below in git-secret.yaml with a real PAT, then:
            #   sops -e --age <public key from age-keygen> git-secret.yaml > flux-operator/git-secret.enc.yaml
            apiVersion: v1
            kind: Secret
            metadata:
              name: git
            type: Opaque
            stringData:
              username: REPLACE_ME
              password: REPLACE_ME
        kind: ConfigMap
        metadata:
          name: git-secret-encrypted-28ft5cbhdk
          namespace: flux-system
        ---
        apiVersion: v1
        data:
          retry-until.sh: |
            #!/bin/sh
            # Shared by both bootstrap Jobs (instance-apply-job.yaml, secret-decrypt-job.yaml).
            # Polls a check command until it succeeds, then runs an action command once.
            # Bounded by activeDeadlineSeconds on the Job itself, not by this script —
            # Kubernetes kills the pod (Job goes Failed) if the deadline passes while
            # this loop is still polling.
            set -eu

            CHECK="$1"
            ACTION="$2"

            until eval "$CHECK"; do
              echo "waiting: $CHECK"
              sleep 10
            done

            eval "$ACTION"
        kind: ConfigMap
        metadata:
          name: retry-until-script-m6mh869k75
          namespace: flux-system
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: flux-operator-install
          namespace: flux-system
        spec:
          backoffLimit: 3
          template:
            spec:
              containers:
              - args:
                - |
                  set -eu
                  helm upgrade --install flux-operator \
                    oci://ghcr.io/controlplaneio-fluxcd/charts/flux-operator \
                    --namespace flux-system \
                    -f /values/values.yaml \
                    --wait --timeout 10m
                command:
                - /bin/sh
                - -c
                image: alpine/k8s:1.36.6
                name: install
                volumeMounts:
                - mountPath: /values
                  name: values
                  readOnly: true
              restartPolicy: Never
              serviceAccountName: flux-operator-installer
              volumes:
              - configMap:
                  name: flux-operator-values-bd478ft2hd
                name: values
          ttlSecondsAfterFinished: 1800
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: fluxinstance-apply
          namespace: flux-system
        spec:
          activeDeadlineSeconds: 1800
          backoffLimit: 3
          template:
            spec:
              containers:
              - args:
                - kubectl get crd fluxinstances.fluxcd.controlplane.io >/dev/null 2>&1
                - kubectl apply -f /manifest/instance.yaml
                command:
                - /bin/sh
                - /scripts/retry-until.sh
                image: alpine/k8s:1.36.6
                name: apply
                volumeMounts:
                - mountPath: /scripts
                  name: retry-until-script
                - mountPath: /manifest
                  name: fluxinstance-manifest
              restartPolicy: Never
              serviceAccountName: fluxinstance-apply
              volumes:
              - configMap:
                  defaultMode: 365
                  name: retry-until-script-m6mh869k75
                name: retry-until-script
              - configMap:
                  name: fluxinstance-manifest-mg4h862fh9
                name: fluxinstance-manifest
          ttlSecondsAfterFinished: 1800
        ---
        apiVersion: batch/v1
        kind: Job
        metadata:
          name: sops-decrypt-git-secret
          namespace: flux-system
        spec:
          activeDeadlineSeconds: 900
          backoffLimit: 3
          template:
            spec:
              containers:
              - args:
                - |
                  set -eu
                  apk add --no-cache sops age >/dev/null
                  SOPS_AGE_KEY_FILE=/age/age.agekey \
                    sops -d /encrypted/git-secret.enc.yaml | kubectl apply -f -
                command:
                - /bin/sh
                - -c
                image: alpine/k8s:1.36.6
                name: decrypt
                volumeMounts:
                - mountPath: /encrypted
                  name: git-secret-encrypted
                - mountPath: /age
                  name: sops-age
                  readOnly: true
              restartPolicy: Never
              serviceAccountName: sops-decrypt
              volumes:
              - configMap:
                  name: git-secret-encrypted-28ft5cbhdk
                name: git-secret-encrypted
              - name: sops-age
                secret:
                  secretName: sops-age
          ttlSecondsAfterFinished: 1800
